<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Abgemeldet – Portiqo</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
  :root{--bg:#eef2f7;--surface:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--accent:#2563eb;--hero:#0f172a}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b1220;--surface:#111c33;--text:#e6edf6;--muted:#94a3b8;--line:#1e293b;--accent:#3b82f6}}
  :root[data-theme="dark"]{--bg:#0b1220;--surface:#111c33;--text:#e6edf6;--muted:#94a3b8;--line:#1e293b;--accent:#3b82f6}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.55;padding:24px 16px}
  .box{max-width:480px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:30px 26px;text-align:center}
  .brand{display:inline-flex;align-items:center;gap:9px;font-family:Sora,system-ui,sans-serif;font-weight:800;font-size:19px;text-decoration:none;color:var(--text);margin-bottom:22px}
  .brand svg{width:26px;height:26px}
  h1{font-family:Sora,system-ui,sans-serif;font-size:24px;margin:0 0 10px;text-wrap:balance}
  p{color:var(--muted);margin:0 0 14px}
  a.btn{display:inline-block;margin-top:8px;background:var(--accent);color:#fff;text-decoration:none;padding:11px 18px;border-radius:10px;font-weight:600}
  .alt{display:none}
</style>
</head>
<body>
<main class="box">
  <a class="brand" href="/"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#2563eb"/><path d="M8 22V10h6.2c2.7 0 4.4 1.6 4.4 4s-1.7 4-4.4 4H11v4H8Zm3-6.7h2.8c1.2 0 1.9-.6 1.9-1.6s-.7-1.6-1.9-1.6H11v3.2Z" fill="#fff"/><circle cx="23" cy="12" r="2.4" fill="#4ade80"/></svg>Portiqo</a>
  <h1>Du bist abgemeldet.</h1>
  <p>Wir haben deine E-Mail-Adresse und deine Angaben von der Warteliste gelöscht. Du bekommst keine weiteren Nachrichten von uns.</p>
  <a class="btn" href="/">Zur Startseite</a>
</main>

</body>
</html>
